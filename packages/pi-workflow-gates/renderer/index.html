<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PI-Workflow 需求看板</title>
<style>
  /* 深浅色自适应：不依赖宿主变量，用系统/宿主主题的 prefers-color-scheme */
  :root {
    --bg: #f5f6f8; --card: #ffffff; --border: #d9dcdf; --text: #1f2328;
    --dim: #6a737d; --accent: #2f6fdb; --ok: #1a7f37; --warn: #9a6700;
    --bad: #cf222e; --chip: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --border: #262b36; --text: #e6e9ef;
      --dim: #8b93a3; --accent: #4f8cff; --ok: #34c77b; --warn: #e6a23c;
      --bad: #e5534b; --chip: #262b36;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
    padding: 16px 20px 24px;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; margin-left: auto; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar button {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12px;
  }
  .toolbar button.active { border-color: var(--accent); color: var(--accent); }
  .toolbar button:hover { border-color: var(--accent); }
  .refresh { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; white-space: nowrap; }
  tr:hover td { background: var(--chip); }
  td.id { font-family: "SF Mono", Menlo, monospace; font-size: 12px; white-space: nowrap; }
  td.title { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.proj { color: var(--dim); white-space: nowrap; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    border: 1px solid var(--border); white-space: nowrap;
  }
  .badge.draft, .badge.clarifying { color: var(--dim); }
  .badge.clarified, .badge.designing, .badge.reviewed { color: var(--warn); border-color: var(--warn); }
  .badge.confirmed, .badge.planned, .badge.developing { color: var(--accent); border-color: var(--accent); }
  .badge.cr-agent, .badge.cr-human { color: #8a4fd8; border-color: #8a4fd8; }
  .badge.cr-confirmed, .badge.testing { color: #0e8a8a; border-color: #0e8a8a; }
  .badge.ready-release, .badge.released { color: var(--ok); border-color: var(--ok); }
  .badge.archived { color: var(--dim); border-color: var(--dim); opacity: 0.7; }
  .badge.blocked, .badge.change-requested, .badge.dep-warn { color: var(--bad); border-color: var(--bad); }
  .num { font-family: "SF Mono", Menlo, monospace; text-align: right; }
  .num.bad { color: var(--bad); }
  .empty { color: var(--dim); text-align: center; padding: 48px 0; }
  .proj-group {
    margin: 6px 0 2px; color: var(--dim); font-size: 12px; font-weight: 600;
    padding: 4px 2px; border-bottom: 1px solid var(--border);
  }
  .error { color: var(--bad); padding: 12px; background: var(--card); border-radius: 8px; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <h1>需求看板</h1>
    <span class="meta" id="meta">加载中…</span>
  </header>
  <div class="toolbar" id="filters"></div>
  <div id="content"><div class="empty">加载中…</div></div>

<script>
(async () => {
  const bridge = window.pluginBridge;
  // 面板与侧栏视图的 bridge 都只有 invoke(channel, payload)，payload 为对象
  const invoke = (ch, payload) => bridge.invoke(ch, payload ?? {});

  const FILTERS = [
    { key: "active", label: "进行中" },
    { key: "cr", label: "CR 阶段" },
    { key: "blocked", label: "异常" },
    { key: "released", label: "已发布" },
    { key: "all", label: "全部" },
  ];
  const CR_STATES = ["cr-agent", "cr-human", "cr-confirmed"];
  const DONE_STATES = ["released", "archived"];

  let allItems = [];
  let currentFilter = "active";

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function applyFilter(items, key) {
    if (key === "all") return items;
    if (key === "active") return items.filter(r => !DONE_STATES.includes(r.status));
    if (key === "cr") return items.filter(r => CR_STATES.includes(r.status));
    if (key === "blocked") return items.filter(r => r.status === "blocked" || r.status === "change-requested" || (r.blockedBy && r.blockedBy.length));
    if (key === "released") return items.filter(r => DONE_STATES.includes(r.status));
    return items;
  }

  function rowHtml(r) {
    const dep = (r.dependsOn && r.dependsOn.length)
      ? (r.blockedBy && r.blockedBy.length
          ? `<span class="badge dep-warn" title="依赖未发布：${esc(r.blockedBy.join("、"))}">⚠ ${r.blockedBy.length} 项未发布</span>`
          : `<span class="badge">${r.dependsOn.length} 项已就绪</span>`)
      : "-";
    return `<tr>
      <td class="id">${esc(r.reqId)}</td>
      <td class="title" title="${esc(r.title)}">${esc(r.title)}</td>
      <td class="proj">${esc(r.project)}</td>
      <td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td>
      <td>${dep}</td>
      <td>${esc(r.done ? "✓" : "")}</td>
      <td>${esc((r.updatedAt || "").slice(0, 10))}</td>
    </tr>`;
  }

  function render() {
    const items = applyFilter(allItems, currentFilter);
    const content = document.getElementById("content");
    if (!items.length) {
      content.innerHTML = `<div class="empty">当前过滤条件下没有需求。<br/>用 /req-new 建档（自动登记进跨项目注册中心）。</div>`;
      return;
    }
    // 按项目分组
    const byProject = {};
    for (const it of items) (byProject[it.project] = byProject[it.project] || []).push(it);
    const projects = Object.keys(byProject).sort();
    let html = "";
    for (const proj of projects) {
      html += `<div class="proj-group">${esc(proj)}（${byProject[proj].length}）</div>
        <table><thead><tr>
          <th>编号</th><th>标题</th><th>状态</th><th>依赖</th><th>完成</th><th>更新</th>
        </tr></thead><tbody>${byProject[proj].map(rowHtml).join("")}</tbody></table>`;
    }
    content.innerHTML = html;
  }

  async function load() {
    const data = await invoke("dashboard.data");
    allItems = data.items || [];
    const meta = document.getElementById("meta");
    meta.textContent = `共 ${data.total ?? allItems.length} 个需求 · ${data.currentProject || "当前项目"} · 更新于 ${(data.updatedAt || "").slice(0, 16).replace("T", " ")}`;
    render();
  }

  const filtersEl = document.getElementById("filters");
  for (const f of FILTERS) {
    const b = document.createElement("button");
    b.textContent = f.label;
    if (f.key === currentFilter) b.className = "active";
    b.addEventListener("click", () => {
      currentFilter = f.key;
      for (const x of filtersEl.children) x.className = "";
      b.className = "active";
      render();
    });
    filtersEl.appendChild(b);
  }
  // 刷新按钮
  const rb = document.createElement("button");
  rb.textContent = "刷新";
  rb.className = "refresh";
  rb.addEventListener("click", load);
  filtersEl.appendChild(rb);

  await load();
})().catch(e => {
  document.getElementById("content").innerHTML =
    `<div class="error">加载失败：${esc(String(e && e.message || e))}</div>
     <div class="hint">请确认插件「PI-Workflow Gates」已加载；看板数据来自插件进程的全局注册中心（dashboard.data 通道）。</div>`;
  function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
});
</script>
</body>
</html>
